<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1120" />
    <meta
      name="description"
      content="Pelatih kebugaran AI yang mengoreksi form latihan secara real-time langsung di perangkat."
    />

    <!-- Design typeface. Deliberately not preloaded and not cached by the
         service worker: offline it falls back to the system stack and every
         size in the stylesheet is explicit, so nothing shifts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest for home-screen installs and reads these. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LATIH" />

    <title>LATIH — Pelatih Pribadi AI</title>
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">LATIH</h1>
        <a class="app__link" href="/plan.html">Rencana →</a>
        <p class="app__perf" id="perf"></p>
      </header>

      <section class="stage">
        <!-- `playsinline` stops iOS from forcing the video fullscreen, which
             would hide the skeleton overlay entirely. -->
        <video id="video" class="stage__video" playsinline muted></video>
        <canvas id="canvas" class="stage__overlay"></canvas>

        <!-- Tints the lower half sage or amber. Behind the HUD, in front of the
             video, so the number below always has contrast to sit on. -->
        <div class="hud__wash" id="hudWash"></div>

        <div class="hud" data-state="good" id="hud">
          <div class="hud__top">
            <span class="hud__movement" id="movementLabel">PUSH-UP</span>
            <span class="hud__voice">
              <span class="hud__dot" aria-hidden="true"></span>
              <span>SUARA</span>
            </span>
          </div>

          <!-- Set progress read by length, not by reading. One strip per rep of
               the target; done reps are long and coloured. -->
          <div class="hud__strips" id="repStrips" aria-hidden="true"></div>

          <div class="hud__readout">
            <!-- The number is the signal. It changes colour itself, so knowing
                 the form status costs no eye movement away from the count. -->
            <div class="hud__count" id="repCount">0</div>
            <!-- Doubles as the correction slot: aria-live so a screen reader
                 announces the cue the moment it replaces the caption. -->
            <p class="hud__caption" id="repCaption" role="status" aria-live="polite">
              BERSIAP
            </p>
          </div>
        </div>

        <p class="banner" id="statusBanner" hidden></p>
      </section>

      <section class="controls">
        <label class="control">
          <span class="control__label">Gerakan</span>
          <select id="exercise" class="control__input">
            <option value="pushup">Push-up</option>
            <option value="squat">Squat</option>
          </select>
        </label>

        <label class="control">
          <span class="control__label">Model</span>
          <select id="model" class="control__input">
            <option value="lite">Lite (cepat)</option>
            <option value="full">Full (akurat)</option>
          </select>
        </label>

        <button id="start" class="control__button" type="button">Mulai</button>
        <button id="finishSet" class="control__button control__button--ghost" type="button" hidden>
          Selesai set
        </button>
      </section>

      <section class="coach" id="coachPanel" hidden aria-live="polite">
        <h2 class="coach__title">Umpan balik pelatih</h2>
        <p class="coach__narration" id="coachNarration"></p>
        <p class="coach__focus" id="coachFocus"></p>
        <p class="coach__meta" id="coachMeta"></p>
      </section>

      <section class="nutrition">
        <h2 class="nutrition__title">Tanya gizi</h2>
        <form class="nutrition__form" id="nutritionForm">
          <input
            type="text"
            id="nutritionQuestion"
            class="nutrition__input"
            placeholder="Berapa protein tempe?"
            maxlength="300"
            autocomplete="off"
          />
          <button type="submit" class="nutrition__submit">Tanya</button>
        </form>

        <p class="nutrition__answer" id="nutritionAnswer" hidden></p>
        <p class="nutrition__warning" id="nutritionWarning" hidden></p>

        <!-- The cited rows are shown in full so the answer can be checked
             against the source without leaving the page. -->
        <div class="nutrition__citations" id="nutritionCitations" hidden></div>
        <p class="nutrition__verify" id="nutritionVerify" hidden></p>
      </section>

      <!-- Open by default: placing the camera wrong is the single biggest
           cause of bad tracking, and it is far cheaper to prevent than to
           detect and explain afterwards. -->
      <details class="guide" id="guide" open>
        <summary class="guide__summary">Posisi kamera</summary>
        <dl class="guide__list" id="guideList"></dl>
        <p class="guide__note" id="guideNote"></p>
      </details>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
